name: keepalive

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keepalive commit (prevents 60-day inactivity auto-disable)
        run: |
          git config user.name "sigma-bot[bot]"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
